<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TFF Responder Link Tool</title><link rel="stylesheet" href="/styles.css"></head><body><main class="section" style="max-width:900px;margin:auto"><div class="eyebrow">Internal responder utility</div><h2>Think Flow First Link Generator</h2><p class="section-lead">Choose the source, campaign, delivery channel and entry door. The tool creates the tracked link and a ready-to-send reply.</p><div class="intake-panel"><label>Original source</label><select class="field" id="src"><option value="tiktok">TikTok</option><option value="facebook">Facebook</option><option value="instagram">Instagram</option><option value="youtube">YouTube</option><option value="referral">Referral</option><option value="offline">Offline / seminar</option><option value="other">Other</option></select><label>Campaign / hook code</label><input class="field" id="campaign" placeholder="e.g. STK-03"><label>Delivery channel</label><select class="field" id="via"><option value="whatsapp">WhatsApp</option><option value="telegram">Telegram</option><option value="messenger">Messenger</option><option value="email">Email</option><option value="dm">Platform DM</option></select><label>Entry door</label><select class="field" id="door"><option value="stroke">Stroke</option><option value="heart">Heart Disease</option><option value="parkinsons">Parkinson's</option><option value="prevention">Prevention</option><option value="stemcells">Stem Cells</option><option value="longevity">Longevity & Biohacking</option><option value="before-you-travel">Before Overseas Treatment</option><option value="recovery">Recovery</option><option value="start">General / Start</option></select><button class="btn" id="generate">Generate</button><div id="result" style="margin-top:24px"></div></div></main><script>const base='https://thinkflowfirst.com';document.getElementById('generate').onclick=()=>{const src=document.getElementById('src').value;const campaign=document.getElementById('campaign').value.trim();const via=document.getElementById('via').value;const door=document.getElementById('door').value;const u=new URL('/'+door,base);u.searchParams.set('src',src);if(campaign)u.searchParams.set('campaign',campaign);u.searchParams.set('via',via);const msg=`Thanks for responding. We put together a short explanation of what we mean by “Think Flow First” in relation to ${door==='start'?'your question':door.replaceAll('-',' ')}. You can start here: ${u.toString()}`;document.getElementById('result').innerHTML=`<label>Tracked link</label><input class="field" id="linkout" value="${u.toString()}" readonly><label>Suggested reply</label><textarea class="field" id="msgout" rows="5" readonly>${msg}</textarea><div class="form-actions"><button class="btn" id="copymsg">Copy reply + link</button><button class="btn secondary" id="copylink">Copy link only</button></div>`;document.getElementById('copymsg').onclick=async()=>{await navigator.clipboard.writeText(msg);document.getElementById('copymsg').textContent='Copied'};document.getElementById('copylink').onclick=async()=>{await navigator.clipboard.writeText(u.toString());document.getElementById('copylink').textContent='Copied'};};</script></body></html>
